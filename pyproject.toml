[project]
name = "sniper"
version = "0.1.0"
description = "Research lab for an intraday NQ/ES strategy aimed at Topstep Combines and XFA payouts"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sniper"]
