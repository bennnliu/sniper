  vps_vpn_remote_orders: {value: prohibited, source: api, verified: "2026-11-22", status: verified,
                          note: "Orders must come from personal device. A server may do data, backtests, logging, read-only dashboards."}
  live_funded_via_api: {value: false, source: api, verified: "2026-11-22", status: verified}
  orders_final: {value: true, source: api, verified: "2026-11-22", status: verified}
  rate_limits: {value: "unquantified fair use; back off and retry", source: api, verified: "2026-11-22", status: verified}

prohibited:
  hft_definition: {value: null, source: prohibited_strategies, verified: "2026-11-22", status: verified,
                   note: "No numeric threshold. SIM-abuse examples describe 'hundreds or thousands of trades per day, with average durations measured in seconds, not minutes'. Our bot-side guard: average hold >= 1 minute and well under 100 orders/day."}
  list:
    - account stacking
    - intentionally depleting a Live Funded Account
    - unfair technology (ultra-high speed systems, mass data entry)
    - exploiting unrealistic SIM fills or SIM queue position
    - trading outside the best bid or offer
    - trading maximum position size into major scheduled news events
    - coordinated trading or cross-account hedging
    - using an external or slow data feed to trade
    - holding a position within 2% of a product's price-limit lock
    - using a VPN
  position_limit_news: {value: "max position can be tightened temporarily around Tier 1 news", source: combine_params, verified: "2026-11-22", status: verified}

open_items:
  - "XFA MLL lock point for 100K/150K: text states the $0 lock only for 50K (at $2,000). We assume lock at $0 once balance reaches the MLL amount for all sizes."
  - "Scaling-tier edges: 'Below $1,500' means $1,500 itself is in the next tier (inclusive). Every other rung reads 'Above $X' or overlaps the rung below ('$1,500 - $2,000' then '$2,000 - $3,000'), so at exactly $X we give the LOWER tier (conservative)."
  - "Back2Funded reactivation window: 30 days (pricing page) vs seven calendar days (rules page)."
  - "Payout caps: rules page says flat up to $5,000/$6,000; payout policy gives per-size caps. We use per-size caps (conservative)."
